<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="BedarfsPilot logo">
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="bp-plane" x1="36" y1="14" x2="56" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand square -->
  <rect width="64" height="64" rx="14" fill="url(#bp-bg)"/>

  <!-- Clipboard body -->
  <rect x="12" y="14" width="30" height="38" rx="4" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.8"/>
  <!-- Clipboard clip -->
  <rect x="22" y="10" width="10" height="6" rx="1.5" fill="#FFFFFF"/>

  <!-- Lines representing list items -->
  <line x1="18" y1="26" x2="34" y2="26" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="18" y1="32" x2="30" y2="32" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="18" y1="38" x2="32" y2="38" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="18" y1="44" x2="26" y2="44" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Paper plane "Pilot" lifting off the top-right corner -->
  <path d="M52 12 L36 24 L42 26 L44 32 Z" fill="url(#bp-plane)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Trail dots -->
  <circle cx="35" cy="29" r="1.2" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="32" cy="33" r="0.9" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="29" cy="36" r="0.6" fill="#FFFFFF" fill-opacity="0.35"/>
</svg>
